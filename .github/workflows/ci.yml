name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Run backend tests
        run: ./gradlew test

  e2e-tests:
    needs: backend-tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Start Postgres
        run: docker compose -f docker-compose.ci.yml up -d --wait

      - name: Build backend jar
        run: ./gradlew bootJar

      - name: Start backend
        run: |
          mkdir -p build/e2e-storage
          java -jar build/libs/*.jar > build/backend.log 2>&1 &
          echo $! > build/backend.pid
        env:
          SPRING_PROFILES_ACTIVE: local
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/streamcut
          SPRING_DATASOURCE_USERNAME: streamcut
          SPRING_DATASOURCE_PASSWORD: streamcut
          APP_STORAGE_LOCAL_ROOT: ${{ github.workspace }}/build/e2e-storage
          APP_OPERATOR_USERNAME: operator
          APP_OPERATOR_PASSWORD: operator-password
          APP_ARTIFACT_STORAGE_MODE: LOCAL

      - name: Wait for backend health
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://localhost:8080/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat build/backend.log
          exit 1

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run E2E tests
        run: ./gradlew e2eTest -Dselenide.headless=true -Dselenide.baseUrl=http://localhost:8080 -De2e.username=operator -De2e.password=operator-password

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-report
          path: build/reports/e2eTests

      - name: Stop backend
        if: always()
        run: |
          if [ -f build/backend.pid ]; then
            kill "$(cat build/backend.pid)" || true
          fi

      - name: Stop Postgres
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
