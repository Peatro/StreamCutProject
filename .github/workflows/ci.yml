name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run backend tests
        run: ./gradlew --no-daemon test

  e2e-tests:
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/requirements.txt') }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r e2e/requirements.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Start Postgres
        run: docker compose -f docker-compose.ci.yml up -d

      - name: Wait for Postgres
        run: |
          for attempt in {1..30}; do
            if docker compose -f docker-compose.ci.yml exec -T postgres pg_isready -U streamcut -d streamcut; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.ci.yml logs
          exit 1

      - name: Build backend jar
        run: ./gradlew --no-daemon bootJar

      - name: Start backend
        run: |
          mkdir -p build/e2e-storage
          JAR_PATH="$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' | head -n 1)"
          nohup java -jar "$JAR_PATH" > backend.log 2>&1 &
          echo $! > backend.pid
        env:
          SPRING_PROFILES_ACTIVE: local
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/streamcut
          SPRING_DATASOURCE_USERNAME: streamcut
          SPRING_DATASOURCE_PASSWORD: streamcut
          APP_STORAGE_LOCAL_ROOT: ${{ github.workspace }}/build/e2e-storage
          APP_OPERATOR_USERNAME: operator
          APP_OPERATOR_PASSWORD: operator-password

      - name: Wait for backend health
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://localhost:8080/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat backend.log
          exit 1

      - name: Run browser E2E tests
        run: pytest e2e/tests/
        env:
          STREAMCUT_BASE_URL: http://localhost:8080
          STREAMCUT_TEST_USER: operator
          STREAMCUT_TEST_PASSWORD: operator-password

      - name: Capture docker logs
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs > docker-compose-ci.log

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            backend.log
            docker-compose-ci.log
            e2e/artifacts

      - name: Stop backend
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" || true
          fi

      - name: Stop Postgres
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
