services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - streamcut-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - streamcut_net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - streamcut-minio:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - streamcut_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      APP_STORAGE_LOCAL_ROOT: ${APP_STORAGE_LOCAL_ROOT}

      APP_OPERATOR_USERNAME: ${APP_OPERATOR_USERNAME}
      APP_OPERATOR_PASSWORD: ${APP_OPERATOR_PASSWORD}

      APP_ARTIFACT_STORAGE_MODE: ${APP_ARTIFACT_STORAGE_MODE}
      APP_ARTIFACT_STORAGE_ENDPOINT: ${APP_ARTIFACT_STORAGE_ENDPOINT}
      APP_ARTIFACT_STORAGE_PUBLIC_ENDPOINT: ${APP_ARTIFACT_STORAGE_PUBLIC_ENDPOINT}
      APP_ARTIFACT_STORAGE_REGION: ${APP_ARTIFACT_STORAGE_REGION:-us-east-1}
      APP_ARTIFACT_STORAGE_ACCESS_KEY: ${APP_ARTIFACT_STORAGE_ACCESS_KEY}
      APP_ARTIFACT_STORAGE_SECRET_KEY: ${APP_ARTIFACT_STORAGE_SECRET_KEY}
      APP_ARTIFACT_STORAGE_BUCKET: ${APP_ARTIFACT_STORAGE_BUCKET}
      APP_ARTIFACT_STORAGE_PRESIGN_TTL: ${APP_ARTIFACT_STORAGE_PRESIGN_TTL:-15m}

      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:-512MB}
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:-520MB}
    expose:
      - "8080"
    networks:
      - streamcut_net
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - streamcut-data:/data

  download-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_BASE_URL: http://backend:8080
      APP_STORAGE_LOCAL_ROOT: ${APP_STORAGE_LOCAL_ROOT}
      WORKER_ID: ${DOWNLOAD_WORKER_ID:-download-worker-1}
      WORKER_ROLE: download
      PYTHONUNBUFFERED: "1"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - streamcut-data:/data
    networks:
      - streamcut_net

  processing-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_BASE_URL: http://backend:8080
      APP_STORAGE_LOCAL_ROOT: ${APP_STORAGE_LOCAL_ROOT}
      HF_HOME: /model-cache
      WORKER_ID: ${PROCESSING_WORKER_ID:-processing-worker-1}
      WORKER_ROLE: processing
      PYTHONUNBUFFERED: "1"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - streamcut-data:/data
      - streamcut-hf-cache:/model-cache
    networks:
      - streamcut_net

volumes:
  streamcut-postgres:
  streamcut-data:
  streamcut-minio:
  streamcut-hf-cache:

networks:
  streamcut_net:
    external: true