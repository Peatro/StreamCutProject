services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: streamcut
      POSTGRES_USER: streamcut
      POSTGRES_PASSWORD: streamcut
    ports:
      - "5432:5432"
    volumes:
      - streamcut-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamcut -d streamcut"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/streamcut
      SPRING_DATASOURCE_USERNAME: streamcut
      SPRING_DATASOURCE_PASSWORD: streamcut
      APP_STORAGE_LOCAL_ROOT: /data/storage
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - streamcut-data:/data

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      APP_STORAGE_LOCAL_ROOT: /data/storage
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - streamcut-data:/data

volumes:
  streamcut-postgres:
  streamcut-data:
