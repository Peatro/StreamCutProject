name: streamcut

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: streamcut
      POSTGRES_USER: streamcut
      POSTGRES_PASSWORD: streamcut
    ports:
      - "5432:5432"
    volumes:
      - streamcut-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamcut -d streamcut"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - streamcut-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/streamcut
      SPRING_DATASOURCE_USERNAME: streamcut
      SPRING_DATASOURCE_PASSWORD: streamcut
      APP_STORAGE_LOCAL_ROOT: /data/storage
      APP_OPERATOR_USERNAME: operator
      APP_OPERATOR_PASSWORD: operator-password
      APP_ARTIFACT_STORAGE_MODE: S3
      APP_ARTIFACT_STORAGE_ENDPOINT: http://minio:9000
      APP_ARTIFACT_STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      APP_ARTIFACT_STORAGE_REGION: us-east-1
      APP_ARTIFACT_STORAGE_ACCESS_KEY: minioadmin
      APP_ARTIFACT_STORAGE_SECRET_KEY: minioadmin
      APP_ARTIFACT_STORAGE_BUCKET: streamcut-artifacts
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - streamcut-data:/data

  download-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      BACKEND_BASE_URL: http://backend:8080
      APP_STORAGE_LOCAL_ROOT: /data/storage
      WORKER_ID: download-worker-1
      WORKER_ROLE: download
      PYTHONUNBUFFERED: "1"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - streamcut-data:/data

  processing-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      BACKEND_BASE_URL: http://backend:8080
      APP_STORAGE_LOCAL_ROOT: /data/storage
      HF_HOME: /model-cache
      WORKER_ID: processing-worker-1
      WORKER_ROLE: processing
      PYTHONUNBUFFERED: "1"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - streamcut-data:/data
      - streamcut-hf-cache:/model-cache

  export-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      BACKEND_BASE_URL: http://backend:8080
      APP_STORAGE_LOCAL_ROOT: /data/storage
      WORKER_ID: export-worker-1
      WORKER_ROLE: export
      PYTHONUNBUFFERED: "1"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - streamcut-data:/data

volumes:
  streamcut-postgres:
  streamcut-data:
  streamcut-minio:
  streamcut-hf-cache:
