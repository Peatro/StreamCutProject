[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamcut-worker"
version = "0.1.0"
description = "StreamCutProject Python worker"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.2.1",
    "yt-dlp",
]

[project.scripts]
streamcut-worker = "streamcut_worker.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
