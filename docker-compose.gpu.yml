services:
  processing-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile.gpu
    environment:
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: float16
      NVIDIA_DRIVER_CAPABILITIES: all
      # Local Qwen LLM for highlight detection (TASK-088).
      # Set to "true" to enable; requires the GGUF model file in the
      # model-cache volume.  When disabled (default), callers get
      # LlmUnavailableError and fall back to the heuristic path.
      QWEN_ENABLED: "false"
      # QWEN_MODEL_PATH: /model-cache/qwen2.5-7b-instruct-q4_k_m.gguf
      # QWEN_N_GPU_LAYERS: "-1"
      # QWEN_N_CTX: "4096"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
