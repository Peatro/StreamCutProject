spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
app:
  security:
    operator-username: ${APP_OPERATOR_USERNAME}
    operator-password: ${APP_OPERATOR_PASSWORD}
    remember-me-key: ${APP_SECURITY_REMEMBER_ME_KEY}
    remember-me-validity: ${APP_SECURITY_REMEMBER_ME_VALIDITY:30d}
  storage:
    local-root: ${APP_STORAGE_LOCAL_ROOT}
  artifact-storage:
    mode: ${APP_ARTIFACT_STORAGE_MODE:S3}
    endpoint: ${APP_ARTIFACT_STORAGE_ENDPOINT}
    public-endpoint: ${APP_ARTIFACT_STORAGE_PUBLIC_ENDPOINT}
    region: ${APP_ARTIFACT_STORAGE_REGION:us-east-1}
    access-key: ${APP_ARTIFACT_STORAGE_ACCESS_KEY}
    secret-key: ${APP_ARTIFACT_STORAGE_SECRET_KEY}
    bucket: ${APP_ARTIFACT_STORAGE_BUCKET}
    presign-ttl: ${APP_ARTIFACT_STORAGE_PRESIGN_TTL:15m}
  worker-execution:
    stale-timeout: ${APP_WORKER_EXECUTION_STALE_TIMEOUT:2m}
    stale-timeout-overrides:
      ANALYZE: ${APP_WORKER_EXECUTION_ANALYZE_STALE_TIMEOUT:20m}
    reconcile-interval: ${APP_WORKER_EXECUTION_RECONCILE_INTERVAL:30s}
  worker-task-retry:
    policies:
      DOWNLOAD:
        max-attempts: ${APP_WORKER_TASK_RETRY_DOWNLOAD_MAX_ATTEMPTS:3}
        initial-backoff: ${APP_WORKER_TASK_RETRY_DOWNLOAD_INITIAL_BACKOFF:15s}
        max-backoff: ${APP_WORKER_TASK_RETRY_DOWNLOAD_MAX_BACKOFF:2m}
      ANALYZE:
        max-attempts: ${APP_WORKER_TASK_RETRY_ANALYZE_MAX_ATTEMPTS:3}
        initial-backoff: ${APP_WORKER_TASK_RETRY_ANALYZE_INITIAL_BACKOFF:30s}
        max-backoff: ${APP_WORKER_TASK_RETRY_ANALYZE_MAX_BACKOFF:5m}
      EXPORT:
        max-attempts: ${APP_WORKER_TASK_RETRY_EXPORT_MAX_ATTEMPTS:3}
        initial-backoff: ${APP_WORKER_TASK_RETRY_EXPORT_INITIAL_BACKOFF:15s}
        max-backoff: ${APP_WORKER_TASK_RETRY_EXPORT_MAX_BACKOFF:2m}
  retention:
    cleanup-enabled: ${APP_RETENTION_CLEANUP_ENABLED:true}
    source-retention: ${APP_RETENTION_SOURCE_RETENTION:7d}
    artifact-retention: ${APP_RETENTION_ARTIFACT_RETENTION:30d}
    cleanup-cron: ${APP_RETENTION_CLEANUP_CRON:0 0 3 * * *}
    cleanup-zone: ${APP_RETENTION_CLEANUP_ZONE:UTC}
