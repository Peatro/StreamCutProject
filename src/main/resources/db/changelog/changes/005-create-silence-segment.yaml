databaseChangeLog:
  - changeSet:
      id: 005-create-silence-segment
      author: codex
      comment: Create the silence_segment table for persisted worker silence intervals.
      changes:
        - createTable:
            tableName: silence_segment
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: job_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: start_sec
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: false
              - column:
                  name: end_sec
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: false
              - column:
                  name: duration_sec
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: silence_segment
            baseColumnNames: job_id
            referencedTableName: vod_job
            referencedColumnNames: id
            constraintName: fk_silence_segment_job_id
        - createIndex:
            tableName: silence_segment
            indexName: idx_silence_segment_job_start
            columns:
              - column:
                  name: job_id
              - column:
                  name: start_sec
