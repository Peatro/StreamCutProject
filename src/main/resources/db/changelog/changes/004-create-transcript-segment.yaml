databaseChangeLog:
  - changeSet:
      id: 004-create-transcript-segment
      author: codex
      comment: Create the transcript_segment table for persisted worker transcripts.
      changes:
        - createTable:
            tableName: transcript_segment
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: job_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: start_sec
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: false
              - column:
                  name: end_sec
                  type: DOUBLE PRECISION
                  constraints:
                    nullable: false
              - column:
                  name: text
                  type: CLOB
                  constraints:
                    nullable: false
              - column:
                  name: word_count
                  type: INT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: transcript_segment
            baseColumnNames: job_id
            referencedTableName: vod_job
            referencedColumnNames: id
            constraintName: fk_transcript_segment_job_id
        - createIndex:
            tableName: transcript_segment
            indexName: idx_transcript_segment_job_start
            columns:
              - column:
                  name: job_id
              - column:
                  name: start_sec
